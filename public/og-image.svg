<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#041f17" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#18181b" stop-opacity="0.6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Surface -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Ambient Glow -->
  <circle cx="1000" cy="120" r="280" fill="#10b981" opacity="0.15" filter="url(#glow)" />
  <circle cx="150" cy="500" r="250" fill="#059669" opacity="0.12" filter="url(#glow)" />

  <!-- Subtle Grid Pattern -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="150" y1="0" x2="150" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="450" y1="0" x2="450" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="750" y1="0" x2="750" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1050" y1="0" x2="1050" y2="630" />
  </g>

  <!-- Main Content Container -->
  <g transform="translate(80, 80)">
    <!-- Top Pill Badge -->
    <rect x="0" y="0" width="340" height="38" rx="19" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
    <circle cx="20" cy="19" r="5" fill="#34d399" />
    <text x="35" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#a7f3d0" letter-spacing="0.5">
      🇲🇾 SISTEM CRM JUALAN MALAYSIA (RM)
    </text>

    <!-- App Logo & Brand Name -->
    <g transform="translate(0, 60)">
      <!-- Brand Icon Symbol -->
      <rect width="64" height="64" rx="16" fill="#18181b" stroke="#27272a" stroke-width="2" />
      <path d="M14 14H38C44.6274 14 50 19.3726 50 26V26C50 32.6274 44.6274 38 38 38H18" stroke="url(#emeraldGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M26 28L16 38L26 48" stroke="url(#emeraldGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="44" cy="48" r="5" fill="#34d399" />

      <text x="84" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-1">
        Lead<tspan fill="#10b981">Flow</tspan> CRM
      </text>
      <rect x="360" y="16" width="76" height="28" rx="8" fill="#064e3b" stroke="#059669" stroke-width="1" />
      <text x="398" y="35" font-family="monospace" font-size="13" font-weight="800" fill="#34d399" text-anchor="middle">
        PRO POC
      </text>
    </g>

    <!-- Main Headline -->
    <text x="0" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Tukar Lead Iklan Kepada Jualan Pantas.
    </text>
    <text x="0" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="500" fill="#9ca3af">
      High-Velocity WhatsApp Sales CRM &amp; Lead Management System
    </text>

    <!-- Feature Highlights / Tag Grid -->
    <g transform="translate(0, 270)">
      <!-- Feature 1: WhatsApp -->
      <g transform="translate(0, 0)">
        <rect width="240" height="74" rx="12" fill="url(#cardGrad)" stroke="#27272a" stroke-width="1" />
        <circle cx="28" cy="37" r="14" fill="#064e3b" />
        <text x="28" y="42" font-size="14" text-anchor="middle" fill="#34d399">💬</text>
        <text x="52" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff">
          1-Click WhatsApp
        </text>
        <text x="52" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#9ca3af">
          5 Template Skrip Closing
        </text>
      </g>

      <!-- Feature 2: Kanban Pipeline -->
      <g transform="translate(260, 0)">
        <rect width="240" height="74" rx="12" fill="url(#cardGrad)" stroke="#27272a" stroke-width="1" />
        <circle cx="28" cy="37" r="14" fill="#1e293b" />
        <text x="28" y="42" font-size="14" text-anchor="middle" fill="#38bdf8">🗂️</text>
        <text x="52" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff">
          Kanban Pipeline
        </text>
        <text x="52" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#9ca3af">
          Drag &amp; Drop Status Prospek
        </text>
      </g>

      <!-- Feature 3: Quotation & Invois -->
      <g transform="translate(520, 0)">
        <rect width="240" height="74" rx="12" fill="url(#cardGrad)" stroke="#27272a" stroke-width="1" />
        <circle cx="28" cy="37" r="14" fill="#312e81" />
        <text x="28" y="42" font-size="14" text-anchor="middle" fill="#818cf8">📄</text>
        <text x="52" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff">
          Quotation &amp; Invois
        </text>
        <text x="52" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#9ca3af">
          Cetakan Rasmi Format A4
        </text>
      </g>

      <!-- Feature 4: Ads Attribution -->
      <g transform="translate(780, 0)">
        <rect width="260" height="74" rx="12" fill="url(#cardGrad)" stroke="#27272a" stroke-width="1" />
        <circle cx="28" cy="37" r="14" fill="#451a03" />
        <text x="28" y="42" font-size="14" text-anchor="middle" fill="#f59e0b">📊</text>
        <text x="52" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff">
          Meta &amp; TikTok Ads
        </text>
        <text x="52" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#9ca3af">
          Analisis Saluran &amp; Nilai RM
        </text>
      </g>
    </g>

    <!-- Bottom Footer Meta -->
    <g transform="translate(0, 380)">
      <text x="0" y="20" font-family="monospace" font-size="13" font-weight="600" fill="#34d399">
        ⚡ Zero-Backend • 100% Client-Side Privacy • Format Ringgit Malaysia (RM)
      </text>
      <text x="1040" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#6b7280" text-anchor="end">
        sharilm/leads-flow
      </text>
    </g>
  </g>
</svg>
